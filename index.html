<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সালথা সংবাদ | সত্যের পথে, মানুষের পাশে।</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
body{font-family:'Hind Siliguri',sans-serif;background:#f4f5f7;color:#171717;margin:0}
.mh{font-family:'Anek Bangla',sans-serif}
.no-sb::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<div id="pub">
  <div class="bg-white border-b text-xs px-4 py-2 flex justify-between items-center">
    <span><span id="dt"></span> | <b class="text-[#123B63]">ফরিদপুর জেলা সংস্করণ</b></span>
    <button id="adm-btn" onclick="openAdmin()" class="bg-[#123B63] text-white px-3 py-1 rounded font-bold">🔒 অ্যাডমিন</button>
  </div>
  <header class="bg-white border-b px-4 py-4 text-center">
    <a href="#" onclick="home();return false" class="inline-block">
      <h1 class="mh text-5xl leading-none"><span class="text-[#D71920]">সালথা</span> <span>সংবাদ</span></h1>
      <p class="text-sm font-bold text-[#123B63] mt-1">সত্যের পথে, মানুষের পাশে।</p>
    </a>
  </header>
  <nav class="bg-[#123B63] text-white sticky top-0 z-30"><div id="cats" class="flex gap-1 overflow-x-auto no-sb px-3 py-1 text-sm font-semibold"></div></nav>
  <div id="adtop" class="max-w-5xl mx-auto px-4 mt-3"></div>
  <div class="bg-[#171717] text-white flex items-center h-10 px-3 text-sm">
    <span class="bg-[#D71920] px-2 py-1 text-xs font-bold shrink-0">🔥 ব্রেকিং</span>
    <span id="ticker" class="px-3 truncate font-semibold"></span>
  </div>
  <main class="max-w-5xl mx-auto p-4">
    <div id="list" class="grid gap-4 md:grid-cols-3"></div>
    <article id="reader" class="hidden bg-white p-5 rounded-xl border max-w-3xl mx-auto">
      <button onclick="home()" class="text-xs font-bold text-[#D71920] mb-3">← প্রচ্ছদে ফিরুন</button>
      <div><span id="r-cat" class="text-xs font-bold bg-red-50 text-[#D71920] px-2 py-1 rounded"></span></div>
      <h2 id="r-title" class="text-2xl font-bold mt-3 leading-snug"></h2>
      <p id="r-meta" class="text-xs text-gray-500 my-3 py-2 border-y"></p>
      <div id="r-vid" class="mb-4"></div><img id="r-img" class="hidden w-full rounded-lg mb-4"><div id="r-body" class="leading-relaxed text-lg"></div>
      <button onclick="fbShare()" class="mt-6 bg-blue-600 text-white px-3 py-2 rounded text-xs font-bold">ফেসবুকে শেয়ার</button>
      <div id="cm" class="mt-6 pt-4 border-t"></div>
    </article>
  </main>
  <footer class="bg-[#171717] text-center text-gray-400 text-xs py-6 border-t-4 border-[#D71920]">
    <div class="mh text-2xl text-white"><span class="text-[#D71920]">সালথা</span> সংবাদ</div>
    <p id="ft" class="mt-1"></p>
  </footer>
</div>

<div id="login" class="hidden min-h-screen bg-[#0b0f19] flex items-center justify-center p-4">
  <form onsubmit="doLogin(event)" class="bg-[#111827] border border-gray-800 rounded-3xl w-full max-w-md p-7 space-y-4 text-sm text-white">
    <div class="text-center">
      <div class="mh text-3xl"><span class="text-[#D71920]">সালথা</span> সংবাদ</div>
      <p class="text-xs text-gray-400 mt-1">সুরক্ষিত অ্যাডমিন কন্ট্রোল প্যানেল</p>
    </div>
    <p id="err" class="hidden bg-red-950 border border-red-500/50 text-red-200 p-2 rounded-xl text-xs"></p>
    <div><label class="text-xs text-gray-300">ইমেইল</label>
      <input id="em" type="email" required class="w-full mt-1 px-3 py-2 bg-[#1a2333] border border-gray-700 rounded-xl"></div>
    <div><label class="text-xs text-gray-300">পাসওয়ার্ড</label>
      <input id="pw" type="password" required class="w-full mt-1 px-3 py-2 bg-[#1a2333] border border-gray-700 rounded-xl"></div>
    <button class="w-full py-3 bg-[#D71920] rounded-xl font-bold">প্রবেশ করুন</button>
    <button type="button" onclick="resetPw(document.getElementById('em').value)" class="w-full text-xs text-amber-400">পাসওয়ার্ড ভুলে গেছেন / বদলাতে চান?</button>
    <button type="button" onclick="go('pub')" class="w-full text-xs text-gray-400">← মূল ওয়েবসাইটে ফিরুন</button>
  </form>
</div>

<div id="admin" class="hidden min-h-screen bg-[#0b0f19] text-gray-100">
  <header class="bg-[#111827] border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 z-30">
    <b class="mh text-lg">সালথা সংবাদ <span class="text-[10px] text-red-400 border border-red-500/40 px-1.5 rounded">ADMIN</span></b>
    <div class="flex gap-2 text-xs">
      <button onclick="resetPw()" class="bg-gray-800 px-3 py-1.5 rounded-lg">🔑 পাসওয়ার্ড</button>
      <button onclick="go('pub')" class="bg-gray-800 px-3 py-1.5 rounded-lg">🌐 সাইট</button>
      <button onclick="logout()" class="bg-gray-800 px-3 py-1.5 rounded-lg">লগআউট</button>
    </div>
  </header>
  <div class="flex gap-1 overflow-x-auto no-sb p-3 text-xs font-semibold" id="tabs"></div>
  <div id="tab" class="p-4 max-w-4xl mx-auto space-y-4"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,collection,query,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_EMAIL='junayedahmad5003@gmail.com';
const app=initializeApp({
  apiKey:"AIzaSyABKCOjZnTu6155-eho8aqdGVkaxX1oVHw",
  authDomain:"saltha-sangbad.firebaseapp.com",
  projectId:"saltha-sangbad",
  appId:"1:91800137977:web:ba30064469389f181d3228"
});
const auth=getAuth(app),db=getFirestore(app);

const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const $=i=>document.getElementById(i);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const CATS=['সালথা','ফরিদপুর','বাংলাদেশ','রাজনীতি','কৃষি ও অর্থনীতি'];
let S={ticker:'সালথা সংবাদে স্বাগতম',news:[]},CM=[],IS_ADMIN=false,cur=null,curCat='প্রচ্ছদ',unCm=null,loaded=false;
function fix(){S.ads=S.ads||{on:true,code:''};S.rep=S.rep||[];S.seo=S.seo||{title:'',desc:'',phone:'',addr:''};S.news=S.news||[]}
fix();
$('dt').textContent=new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function save(){
  if(!IS_ADMIN)return;
  setDoc(doc(db,'site','state'),{json:JSON.stringify(S)}).catch(()=>alert('সেভ করা যায়নি'));
}
function go(v){['pub','login','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==v));window.scrollTo(0,0);if(v==='admin')tab('dash')}
function openAdmin(){IS_ADMIN?go('admin'):go('login')}
function home(cat){
  if(cat)curCat=cat;
  $('reader').classList.add('hidden');$('list').classList.remove('hidden');
  $('ticker').textContent=S.ticker;
  $('ft').textContent='© ২০২৬ সালথা সংবাদ। সর্বস্বত্ব সংরক্ষিত।'+(S.seo.phone?' ফোন: '+S.seo.phone:'')+(S.seo.addr?' | '+S.seo.addr:'');
  if(S.seo.title)document.title=S.seo.title;
  const ad=$('adtop');ad.innerHTML='';
  if(S.ads.on&&S.ads.code){const f=document.createElement('iframe');f.style.cssText='width:100%;height:100px;border:0';f.setAttribute('sandbox','allow-scripts allow-popups');f.srcdoc=S.ads.code;ad.appendChild(f)}
  $('cats').innerHTML=['প্রচ্ছদ'].concat(CATS).map(c=>'<span onclick="home(\''+c+'\')" class="px-3 py-1.5 rounded whitespace-nowrap cursor-pointer '+(c===curCat?'bg-[#D71920]':'text-gray-100')+'">'+c+'</span>').join('');
  const items=S.news.filter(n=>curCat==='প্রচ্ছদ'||n.c===curCat);
  $('list').innerHTML=items.length?items.map((n,i)=>'<div onclick="openNews('+n.id+')" class="bg-white border rounded-xl p-4 cursor-pointer '+(i===0&&curCat==='প্রচ্ছদ'?'md:col-span-3 border-l-4 border-l-[#D71920]':'')+'">'+(n.im?'<img data-im="'+n.im+'" class="w-full h-44 object-cover rounded-lg mb-2 bg-gray-100">':n.i&&/^https:\/\//.test(n.i)?'<img src="'+esc(n.i)+'" loading="lazy" class="w-full h-44 object-cover rounded-lg mb-2">':'')+'<span class="text-xs font-bold text-[#D71920]">'+esc(n.c)+'</span><h3 class="font-bold '+(i===0?'text-2xl':'text-lg')+' mt-1 leading-snug">'+esc(n.t)+'</h3><p class="text-sm text-gray-600 mt-2">'+esc(n.b.slice(0,110))+'...</p><p class="text-xs text-gray-400 mt-2">'+esc(n.a)+' · 👁 '+bn(n.v)+'</p></div>').join(''):'<p class="text-gray-500">এই বিভাগে এখনো কোনো খবর নেই।</p>';fillImgs();
}
function openNews(id){
  const n=S.news.find(x=>x.id===id);if(!n)return;
  n.v++;cur=n;if(IS_ADMIN)save();
  $('list').classList.add('hidden');$('reader').classList.remove('hidden');
  $('r-cat').textContent=n.c;$('r-title').textContent=n.t;
  $('r-meta').textContent=n.a+' · 👁 '+bn(n.v);$('r-vid').innerHTML=vidEmbed(n.vd);
  const im=$('r-img');delete im.dataset.im;if(n.im){im.removeAttribute('src');im.dataset.im=n.im;im.classList.remove('hidden');fillImgs()}else if(n.i&&/^https:\/\//.test(n.i)){im.src=n.i;im.classList.remove('hidden')}else{im.classList.add('hidden')}
  $('r-body').innerHTML=esc(n.b).replace(/\n/g,'<br><br>');
  renderCm();window.scrollTo(0,0);
}
function fbShare(){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank')}

function renderCm(){
  if(!cur)return;
  const l=CM.filter(c=>c.nid===cur.id&&c.ok);
  $('cm').innerHTML='<p class="font-bold mb-2">পাঠকের মন্তব্য ('+bn(l.length)+')</p>'+l.map(c=>'<div class="py-2 border-b text-sm"><b>'+esc(c.name)+'</b><p>'+esc(c.txt)+'</p></div>').join('')
   +'<form onsubmit="addCm(event)" class="mt-3 space-y-2"><input id="c-n" required maxlength="50" placeholder="আপনার নাম" class="w-full border rounded px-3 py-2 text-sm"><textarea id="c-t" required maxlength="500" rows="3" placeholder="মন্তব্য লিখুন" class="w-full border rounded px-3 py-2 text-sm"></textarea><button class="bg-[#123B63] text-white px-4 py-2 rounded text-sm font-bold">মন্তব্য পাঠান</button></form>';
}
function addCm(e){
  e.preventDefault();
  setDoc(doc(db,'comments',String(Date.now())),{nid:cur.id,name:$('c-n').value,txt:$('c-t').value,ok:false})
   .then(()=>{alert('মন্তব্য মডারেশনের পর প্রকাশ হবে');renderCm()}).catch(()=>alert('মন্তব্য পাঠানো যায়নি'));
}
const okCm=id=>updateDoc(doc(db,'comments',String(id)),{ok:true});
const delCm=id=>deleteDoc(doc(db,'comments',String(id)));

function watchCm(){
  if(unCm)unCm();
  const q=IS_ADMIN?collection(db,'comments'):query(collection(db,'comments'),where('ok','==',true));
  unCm=onSnapshot(q,s=>{
    CM=s.docs.map(d=>{const x=d.data();x.id=Number(d.id);return x});
    if(cur&&!$('reader').classList.contains('hidden'))renderCm();
    if(IS_ADMIN&&!$('admin').classList.contains('hidden')&&$('tab').dataset.t==='cm')tab('cm');
  },()=>{});
}

async function doLogin(e){
  e.preventDefault();const er=$('err');
  try{
    const c=await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);
    if((c.user.email||'').toLowerCase()!==ADMIN_EMAIL){await signOut(auth);throw 0}
    er.classList.add('hidden');$('pw').value='';go('admin');
  }catch(x){er.textContent='ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।';er.classList.remove('hidden')}
}
function resetPw(mail){
  mail=(mail||ADMIN_EMAIL).trim();
  sendPasswordResetEmail(auth,mail).then(()=>alert('পাসওয়ার্ড বদলানোর লিংক ইমেইলে পাঠানো হয়েছে (স্প্যাম ফোল্ডারও দেখুন)')).catch(()=>alert('ইমেইল পাঠানো যায়নি'));
}
function logout(){signOut(auth).then(()=>go('pub'))}

const TABS=[['dash','📊 ড্যাশবোর্ড'],['news','📰 সংবাদ'],['breaking','🔥 ব্রেকিং'],['cats','🗂 বিভাগ'],['ads','📈 বিজ্ঞাপন'],['rep','👥 রিপোর্টার'],['cm','💬 মন্তব্য'],['seo','⚙️ সেটিংস/SEO']];
function tab(t){
  $('tab').dataset.t=t;
  $('tabs').innerHTML=TABS.map(x=>'<button onclick="tab(\''+x[0]+'\')" class="px-3 py-2 rounded-xl whitespace-nowrap '+(x[0]===t?'bg-[#D71920] text-white':'bg-[#111827] text-gray-400')+'">'+x[1]+'</button>').join('');
  const box='bg-[#111827] border border-gray-800 rounded-xl p-4',inp='w-full px-3 py-2 bg-[#1a2333] border border-gray-700 rounded-xl text-sm text-white',btn='w-full py-2.5 bg-[#D71920] rounded-xl font-bold text-sm';
  let h='';
  if(t==='dash'){
    const tv=S.news.reduce((s,n)=>s+n.v,0),mx=Math.max(1,...S.news.map(n=>n.v));
    h='<div class="grid grid-cols-2 gap-3"><div class="'+box+'"><p class="text-xs text-gray-400">মোট সংবাদ</p><p class="text-3xl font-black">'+bn(S.news.length)+'</p></div><div class="'+box+'"><p class="text-xs text-gray-400">সর্বমোট ভিউ</p><p class="text-3xl font-black text-teal-400">'+bn(tv)+'</p></div></div><div class="'+box+'"><p class="font-bold mb-3">খবর অনুযায়ী ভিউ</p>'+S.news.map(n=>'<div class="mb-2 text-xs"><div class="flex justify-between"><span class="truncate pr-2">'+esc(n.t)+'</span><span>'+bn(n.v)+'</span></div><div class="h-2 bg-gray-800 rounded"><div class="h-2 bg-[#D71920] rounded" style="width:'+Math.round(n.v/mx*100)+'%"></div></div></div>').join('')+'</div>';
  }
  if(t==='news'){
    h='<form onsubmit="addNews(event)" class="'+box+' space-y-2"><p class="font-bold">+ নতুন সংবাদ</p><input id="n-t" required placeholder="শিরোনাম" class="'+inp+'"><select id="n-c" class="'+inp+'">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select><input id="n-a" placeholder="লেখকের নাম" value="নিজস্ব প্রতিবেদক" class="'+inp+'"><p class="text-xs text-gray-400">ছবি (ফোন থেকে বেছে নিন, ঐচ্ছিক)</p><input id="n-f" type="file" accept="image/*" class="'+inp+'"><input id="n-i" placeholder="অথবা ছবির লিংক (ঐচ্ছিক)" class="'+inp+'"><input id="n-vd" placeholder="ভিডিও লিংক (YouTube বা Facebook, ঐচ্ছিক)" class="'+inp+'"><textarea id="n-b" required rows="5" placeholder="পূর্ণ খবর" class="'+inp+'"></textarea><button class="'+btn+'">প্রকাশ করুন</button></form><div class="'+box+'"><p class="font-bold mb-2">সব সংবাদ</p>'+S.news.map(n=>'<div class="flex justify-between items-center py-2 border-b border-gray-800 text-sm"><span class="pr-2">'+esc(n.t)+'<br><span class="text-xs text-gray-500">'+esc(n.c)+' · '+bn(n.v)+' ভিউ</span></span><button onclick="delNews('+n.id+')" class="text-red-400 text-xs shrink-0">মুছুন</button></div>').join('')+'</div>';
  }
  if(t==='breaking')h='<div class="'+box+' space-y-2"><p class="font-bold">ব্রেকিং নিউজ টিকার</p><textarea id="tk" rows="3" class="'+inp+'">'+esc(S.ticker)+'</textarea><button onclick="saveTicker()" class="'+btn+'">আপডেট করুন</button></div>';
  if(t==='cats')h='<div class="'+box+'"><p class="font-bold mb-2">বিভাগসমূহ</p>'+CATS.map(c=>'<span class="inline-block bg-[#1a2333] px-3 py-1 rounded-lg text-sm m-1">'+c+'</span>').join('')+'</div>';
  if(t==='ads')h='<div class="'+box+' space-y-2"><p class="font-bold">বিজ্ঞাপন & Adsterra</p><label class="text-sm flex gap-2"><input type="checkbox" id="ad-on" '+(S.ads.on?'checked':'')+'> সব বিজ্ঞাপন চালু (কিল-সুইচ)</label><textarea id="ad-code" rows="5" placeholder="Adsterra ব্যানার কোড এখানে পেস্ট করুন" class="'+inp+'">'+esc(S.ads.code)+'</textarea><button onclick="saveAds()" class="'+btn+'">সেভ করুন</button></div>';
  if(t==='rep')h='<form onsubmit="addRep(event)" class="'+box+' space-y-2"><p class="font-bold">নতুন সদস্য</p><input id="rp-n" required placeholder="নাম" class="'+inp+'"><select id="rp-r" class="'+inp+'"><option>Editor</option><option>Reporter</option></select><button class="'+btn+'">যোগ করুন</button></form><div class="'+box+'"><p class="font-bold mb-2">টিম</p>'+(S.rep.length?S.rep.map((r,i)=>'<div class="flex justify-between py-2 border-b border-gray-800 text-sm"><span>'+esc(r.n)+' <span class="text-xs text-gray-500">'+r.r+'</span></span><button onclick="delRep('+i+')" class="text-red-400 text-xs">মুছুন</button></div>').join(''):'<p class="text-sm text-gray-500">কেউ নেই</p>')+'</div>';
  if(t==='cm')h='<div class="'+box+'"><p class="font-bold mb-2">পাঠক মন্তব্য</p>'+(CM.length?CM.map(c=>'<div class="py-2 border-b border-gray-800 text-sm"><b>'+esc(c.name)+'</b> '+(c.ok?'<span class="text-teal-400 text-xs">প্রকাশিত</span>':'<span class="text-amber-400 text-xs">অপেক্ষমাণ</span>')+'<p class="text-gray-300">'+esc(c.txt)+'</p><div class="text-xs mt-1 flex gap-3">'+(c.ok?'':'<button onclick="okCm('+c.id+')" class="text-teal-400">অনুমোদন</button>')+'<button onclick="delCm('+c.id+')" class="text-red-400">মুছুন</button></div></div>').join(''):'<p class="text-sm text-gray-500">কোনো মন্তব্য নেই</p>')+'</div>';
  if(t==='seo')h='<div class="'+box+' space-y-2"><p class="font-bold">সাইট সেটিংস & এসইও</p><input id="s-t" placeholder="সাইটের টাইটেল" value="'+esc(S.seo.title)+'" class="'+inp+'"><textarea id="s-d" rows="3" placeholder="মেটা বিবরণ" class="'+inp+'">'+esc(S.seo.desc)+'</textarea><input id="s-p" placeholder="ফোন" value="'+esc(S.seo.phone)+'" class="'+inp+'"><input id="s-a" placeholder="ঠিকানা" value="'+esc(S.seo.addr)+'" class="'+inp+'"><button onclick="saveSeo()" class="'+btn+'">সেভ করুন</button></div>';
  $('tab').innerHTML=h;
}
function vidEmbed(u){
  if(!u||!/^https:\/\//.test(u))return '';
  const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if(m)return '<div class="aspect-video"><iframe class="w-full h-full rounded-lg" src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';
  if(/facebook\.com|fb\.watch/.test(u))return '<div class="aspect-video"><iframe class="w-full h-full rounded-lg" src="https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(u)+'&show_text=false" allowfullscreen loading="lazy"></iframe></div>';
  return '';
}
const IMG={};
function fillImgs(){document.querySelectorAll('img[data-im]').forEach(el=>{const id=el.dataset.im;if(IMG[id]){el.src=IMG[id];return}getDoc(doc(db,'images',id)).then(x=>{if(x.exists()){IMG[id]=x.data().d;el.src=IMG[id]}}).catch(()=>{})})}
function compress(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>700000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};im.onerror=rej;im.src=u})}
async function addNews(e){
  e.preventDefault();
  const b=e.target.querySelector('button'),old=b.textContent;b.disabled=true;b.textContent='প্রকাশ হচ্ছে...';
  try{
    const id=S.news.reduce((m,n)=>Math.max(m,n.id),0)+1,item={id,t:$('n-t').value,c:$('n-c').value,a:$('n-a').value||'নিজস্ব প্রতিবেদক',b:$('n-b').value,i:$('n-i').value.trim(),vd:$('n-vd').value.trim(),v:0},f=$('n-f').files[0];
    if(f){const d=await compress(f),iid='i'+Date.now();await setDoc(doc(db,'images',iid),{d});item.im=iid}
    S.news.unshift(item);save();tab('news');
  }catch(x){alert('ছবি আপলোড করা যায়নি, আবার চেষ্টা করুন');b.disabled=false;b.textContent=old}
}
function delNews(id){if(!confirm('এই খবর মুছবেন?'))return;const o=S.news.find(n=>n.id===id);if(o&&o.im)deleteDoc(doc(db,'images',o.im)).catch(()=>{});S.news=S.news.filter(n=>n.id!==id);save();tab('news')}
function saveTicker(){S.ticker=$('tk').value;save();alert('আপডেট হয়েছে')}
function saveAds(){S.ads={on:$('ad-on').checked,code:$('ad-code').value};save();alert('সেভ হয়েছে')}
function addRep(e){e.preventDefault();S.rep.push({n:$('rp-n').value,r:$('rp-r').value});save();tab('rep')}
function delRep(i){S.rep.splice(i,1);save();tab('rep')}
function saveSeo(){S.seo={title:$('s-t').value,desc:$('s-d').value,phone:$('s-p').value,addr:$('s-a').value};save();alert('সেভ হয়েছে')}

Object.assign(window,{go,home,openNews,fbShare,doLogin,resetPw,logout,tab,addNews,delNews,saveTicker,saveAds,addRep,delRep,saveSeo,addCm,okCm,delCm,openAdmin});

onSnapshot(doc(db,'site','state'),s=>{
  if(s.exists()){try{S=Object.assign(S,JSON.parse(s.data().json))}catch(e){}}
  else if(IS_ADMIN&&!loaded){S.news=[];save()}
  loaded=true;fix();
  if(!$('pub').classList.contains('hidden')&&$('reader').classList.contains('hidden'))home();
},()=>{});
onAuthStateChanged(auth,u=>{
  IS_ADMIN=!!u&&(u.email||'').toLowerCase()===ADMIN_EMAIL;
  $('adm-btn').textContent=IS_ADMIN?'⚙️ অ্যাডমিন প্যানেল':'🔒 অ্যাডমিন';
  if(!IS_ADMIN&&!$('admin').classList.contains('hidden'))go('pub');
  watchCm();
});
home();
</script>
