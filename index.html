<script type="application/json" id="seed">{"gen":1793328395990,"news":[{"id":18,"t":"ফরিদপুরে আদালত চত্বর থেকে তুলে নিয়ে যুবককে কুপিয়ে জখমের অভিযোগ","c":"ফরিদপুর","a":"ফরিদপুর প্রতিনিধি","b":"ফরিদপুর শহরে আদালত চত্বর থেকে এক যুবককে তুলে নিয়ে কুপিয়ে জখম করার অভিযোগ উঠেছে। বৃহস্পতিবার (২৯ অক্টোবর) দুপুর সাড়ে ১২টার দিকে শহরের লাশকাটা ঘর বস্তি এলাকায় রেললাইনের পাশে এই ঘটনা ঘটে।\n\nআহত যুবকের নাম মো. বাচ্চু খাঁ (৩২)। তিনি শহরের লক্ষ্মীপুর ডগবস্তি এলাকার রিকশাচালক মো. লাবলু খাঁর ছেলে এবং পেশায় ডেকোরেটর শ্রমিক।\n\nস্বজনদের অভিযোগ, বৃহস্পতিবার সকালে এক বন্ধুর সঙ্গে দেখা করতে আদালতপাড়া এলাকায় গিয়েছিলেন বাচ্চু। সেখান থেকে ১৫ থেকে ২০ জনের একটি দল তাঁকে একটি ইজিবাইকে তুলে লাশকাটা ঘর বস্তি এলাকায় নিয়ে যায়। পরে ধারালো অস্ত্র দিয়ে কুপিয়ে তাঁর বাঁ হাত ও দুই পায়ের রগ কেটে দেওয়া হয় বলে স্বজনেরা দাবি করেছেন। স্থানীয় লোকজন তাঁকে উদ্ধার করে ফরিদপুর মেডিকেল কলেজ হাসপাতাল পরিচালিত ট্রমা সেন্টারে ভর্তি করেন।\n\nএ বিষয়ে ফরিদপুর কোতোয়ালি থানার ভারপ্রাপ্ত কর্মকর্তা (ওসি) মাহমুদুল হাসান বলেছেন, এ ধরনের ঘটনার কোনো তথ্য তাঁর জানা নেই এবং এ ঘটনায় কেউ থানায় অভিযোগও করেননি। হামলার পেছনে কী কারণ রয়েছে কিংবা কারা এতে জড়িত, তা এখনো নিশ্চিত হওয়া যায়নি।","v":0,"ts":1793325832314,"im":"i1793325832345","i":"","vd":""},{"id":17,"t":"সালথায় আইন-শৃঙ্খলা কমিটির মাসিক সভা অনুষ্ঠিত","c":"সালথা","a":"সালথা (ফরিদপুর) প্রতিনিধি","b":"ফরিদপুরের সালথায় উপজেলা আইন-শৃঙ্খলা কমিটির মাসিক সভা অনুষ্ঠিত হয়েছে। বৃহস্পতিবার (২৯ অক্টোবর) বেলা সাড়ে ১১টায় উপজেলা প্রশাসনের আয়োজনে উপজেলা পরিষদের সম্মেলনকক্ষে এই সভা হয়।\n\nউপজেলা নির্বাহী কর্মকর্তা (ইউএনও) দবির উদ্দিনের সভাপতিত্বে সভায় উপস্থিত ছিলেন সহকারী কমিশনার (ভূমি) রিজভী আহমেদ সবুজ, সালথা থানার পরিদর্শক (তদন্ত) ইন্দ্রজিৎ মল্লিক, উপজেলা কৃষি কর্মকর্তা আহসানুল হাবিব আজাদ জনি, উপজেলা স্বাস্থ্য ও পরিবার পরিকল্পনা কর্মকর্তা ডা. আফিফা সুলতানা, উপজেলা বিএনপির সাবেক সভাপতি সিদ্দিকুর রহমান তালুকদার, যুগ্ম-সাধারণ সম্পাদক খন্দকার খায়রুল বাসার আজাদ এবং সালথা প্রেসক্লাবের সভাপতি নুরুল ইসলাম নাহিদ। এ ছাড়া বিভিন্ন সরকারি দপ্তরের কর্মকর্তা, স্কুল-কলেজের প্রধান এবং ইউনিয়ন পরিষদের চেয়ারম্যান ও সচিবেরা সভায় ছিলেন।\n\nসভাপতির বক্তব্যে ইউএনও দবির উদ্দিন উপজেলার সার্বিক আইন-শৃঙ্খলা পরিস্থিতির উন্নয়ন, মাদকের বিস্তার রোধ, নারী ও শিশু নির্যাতন প্রতিরোধ, বাল্যবিয়ে বন্ধ এবং সংঘর্ষ এড়ানোর ওপর গুরুত্ব দেন। সামাজিক যোগাযোগমাধ্যমে গুজব ও অপপ্রচার প্রতিরোধে সবাইকে সচেতন থাকার আহ্বান জানিয়ে তিনি আইন-শৃঙ্খলা পরিস্থিতি স্বাভাবিক রাখতে সংশ্লিষ্ট বাহিনীকে সহযোগিতা করার আহ্বান জানান।","v":0,"ts":1793325785586,"im":"i1793325785615","i":"","vd":""},{"id":16,"t":"ফরিদপুরে ১৪ মামলার আসামি ইউপি চেয়ারম্যান গ্রেপ্তার","c":"ফরিদপুর","a":"ফরিদপুর প্রতিনিধি","b":"ফরিদপুরে ১৪ মামলার আসামি এক ইউনিয়ন পরিষদ চেয়ারম্যানকে গ্রেপ্তার করেছে পুলিশ। সোমবার (২৬ অক্টোবর) বিকেলে শহরের রাজবাড়ী রোড মোড় এলাকা থেকে কোতোয়ালি থানা পুলিশ তাকে গ্রেপ্তার করে।\nগ্রেপ্তার ব্যক্তির নাম শহিদুল ইসলাম মজনু। তিনি ইশান গোপালপুর ইউনিয়ন পরিষদের চেয়ারম্যান এবং আওয়ামী লীগ নেতা। পুলিশের ভাষ্য, তার বিরুদ্ধে বাস পোড়ানো, নাশকতা ও সরকারি কাজে বাধা দেওয়াসহ ১৪টি মামলা রয়েছে। এর আগে যাত্রীবাহী বাস পোড়ানোর মামলায় তাকে গ্রেপ্তার দেখানো হয়েছিল।\nপুলিশ জানিয়েছে, ২০২৪ সালের ৫ আগস্ট সরকার পতনের পর থেকে তিনি আত্মগোপনে ছিলেন। গ্রেপ্তারের পর প্রাথমিক জিজ্ঞাসাবাদে অসুস্থ বোধ করলে তাকে পিজি হাসপাতালে নেওয়া হয়। সুস্থ হলে তাকে থানায় এনে জিজ্ঞাসাবাদ করা হবে বলে জানিয়েছেন কোতোয়ালি থানার ভারপ্রাপ্ত কর্মকর্তা মো. মাহমুদুল হাসান।\n(ছবি: প্রতীকী)","v":0,"ts":1793315352845,"im":"i1793315352861","i":"","vd":""},{"id":15,"t":"সালথায় বাসচাপায় প্রবাসী যুবক নিহত","c":"সালথা","a":"সালথা (ফরিদপুর) প্রতিনিধি","b":"ফরিদপুরের সালথায় বাসচাপায় এক প্রবাসী যুবক নিহত হয়েছেন। মঙ্গলবার (২৭ অক্টোবর) বল্লভদী ইউনিয়নের চর বল্লভদী মোল্লার মোড় এলাকায় এ দুর্ঘটনা ঘটে।\nনিহত যুবকের নাম নায়েম মোল্লা (২৪)। তিনি সৌদি আরবে থাকতেন, কিছুদিন আগে পরিবারের কাছে বেড়াতে এসেছিলেন। সেদিন তিনি আত্মীয়ের বাড়িতে যাচ্ছিলেন। পথে একটি বাস তাকে চাপা দিলে ঘটনাস্থলেই তার মৃত্যু হয়।\nভাঙ্গা হাইওয়ে পুলিশের ভারপ্রাপ্ত কর্মকর্তা মো. তৈমুর ইসলাম জানিয়েছেন, মরদেহ উদ্ধার করে থানায় নেওয়া হয়েছে। এ ঘটনায় আইনি ব্যবস্থা নেওয়া হবে।\n(ছবি: প্রতীকী)","v":0,"ts":1793315244862,"im":"i1793315244885","i":"","vd":""},{"id":14,"t":"সালথায় সার ও বীজ মনিটরিং কমিটির মাসিক সভা অনুষ্ঠিত","c":"সালথা","a":"সালথা (ফরিদপুর) প্রতিনিধি","b":"ফরিদপুরের সালথা উপজেলা সার ও বীজ মনিটরিং কমিটির মাসিক সভা অনুষ্ঠিত হয়েছে। বৃহস্পতিবার (২৯ অক্টোবর) দুপুরে উপজেলা পরিষদের হলরুমে এ সভার আয়োজন করা হয়।\n\nউপজেলা নির্বাহী কর্মকর্তা (ইউএনও) দবির উদ্দিনের সভাপতিত্বে সভায় উপস্থিত ছিলেন উপজেলা কৃষি কর্মকর্তা আহসানুল হাবিব আল আজাদ জনি, উপজেলা স্বাস্থ্য ও পরিবার পরিকল্পনা কর্মকর্তা ডা. আফিফা সুলতানা, উপজেলা বিএনপির সাবেক সভাপতি মো. সিদ্দিকুর রহমান তালুকদার, সাবেক সিনিয়র যুগ্ম সাধারণ সম্পাদক খন্দকার খায়রুল বাসার আজাদ, সালথা প্রেসক্লাবের সভাপতি নুরুল ইসলাম নাহিদসহ উপ-সহকারী কৃষি কর্মকর্তারা, বিসিআইসি ও বিএডিসির সার ডিলার এবং গণমাধ্যমকর্মীরা।\n\nসভায় উপজেলায় সার ও বীজের সরবরাহ, বিতরণ ও মজুত পরিস্থিতি এবং কৃষকদের কাছে সঠিকভাবে সার পৌঁছানো নিশ্চিত করা নিয়ে বিস্তারিত আলোচনা হয়।\n\nউপজেলা কৃষি কর্মকর্তা বলেন, কৃষকরা যাতে সার সংগ্রহ করতে গিয়ে কোনো ভোগান্তির শিকার না হন, সে বিষয়ে সবাইকে আন্তরিকভাবে কাজ করতে হবে। সরকারি বরাদ্দের সার নির্ধারিত এলাকার বাইরে পাচার বা অবৈধভাবে স্থানান্তর করা যাবে না। সার বিতরণে স্বচ্ছতা নিশ্চিত করতে ডিলারদের মজুত ও বিক্রয় কার্যক্রম নিয়মিত তদারকি করা হবে।","v":0,"ts":1793295826272,"im":"i1793295826296","i":"","vd":""},{"id":13,"t":"ভাঙ্গায় ২৫০ বস্তা সরকারি সারসহ ডিলার ও ট্রাকের হেলপার আটক","c":"ফরিদপুর","a":"ফরিদপুর প্রতিনিধি","b":"ফরিদপুরের ভাঙ্গা উপজেলায় পাচারের সময় ২৫০ বস্তা সরকারি ডিএপি সারসহ এক সার ডিলার ও ট্রাকচালকের সহকারীকে আটক করেছে প্রশাসন। বুধবার (২৮ অক্টোবর) দিবাগত রাতে উপজেলার মালিগ্রাম ফ্লাইওভারের নিচ থেকে সারবোঝাই ট্রাকটি জব্দ করা হয়। সারগুলো পার্শ্ববর্তী জেলায় নিয়ে যাওয়ার চেষ্টা চলছিল বলে অভিযোগ উঠেছে।\n\nআটক ডিলারের নাম এ কে এম ইলিয়াস হাওলাদার। তিনি মালিগ্রাম বাজারের মেসার্স হাওলাদার ট্রেডার্সের স্বত্বাধিকারী এবং চান্দ্রা ইউনিয়নের বিসিআইসি ও বিএডিসি অনুমোদিত সার ডিলার।\n\nস্থানীয় সূত্রে জানা গেছে, রাতে ফ্লাইওভারের নিচে সারবোঝাই ট্রাকটির চলাচল সন্দেহজনক মনে হলে স্ function vidEmbed(u){

  if(/facebook\.com|fb\.watch/.test(u))return '<div class="aspect-video"><iframe class="w-full h-full rounded-lg" src="https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(u)+'&show_text=false" allowfullscreen loading="lazy"></iframe></div>';
  return '';
}
const IMG={};

function loadImg(el){const id=el.dataset.im;if(!id)return;if(IMG[id]){el.src=IMG[id];return}getDoc(doc(db,'images',id)).then(x=>{if(x.exists()){IMG[id]=x.data().d;el.src=IMG[id]}}).catch(()=>{})}

const MAXB=200*1024;
function shrink(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{let w=Math.min(1,800/Math.max(im.width,im.height)),d='';
  for(let k=0;k<6;k++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*w));c.height=Math.max(1,Math.round(im.height*w));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    for(let q=.8;q>=.39;q-=.1){d=c.toDataURL('image/jpeg',q);if((d.length-23)*.75<=MAXB){res(d);return}}
    w*=.8}
  res(d)};im.onerror=rej;im.src=src})}
function compress(file){const u=URL.createObjectURL(file);return shrink(u).finally(()=>URL.revokeObjectURL(u))}
async function shrinkOld(){
  let done=0,saved=0;
  for(const n of S.news.filter(n=>n.im)){try{const x=await getDoc(doc(db,'images',n.im));if(!x.exists())continue;const d=x.data().d;if((d.length-23)*.75<=MAXB)continue;const nd=await shrink(d);await setDoc(doc(db,'images',n.im),{d:nd});IMG[n.im]=nd;done++;saved+=Math.round((d.length-nd.length)*.75/1024)}catch(e){}}
  alert(done?bn(done)+'টি ছবি ছোট করা হয়েছে (প্রায় '+bn(saved)+' KB কম)':'কোনো ছবি ২০০KB-এর বেশি নেই');
}
