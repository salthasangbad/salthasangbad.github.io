<script>
(function(){try{if(/^#(n\d+|about|contact|privacy|saltha-admin)$/.test(location.hash))return;
var c=JSON.parse(localStorage.getItem('saltha_cache')||'null');if(!c||!c.news||!c.news.length)return;
var n=c.news.slice().sort(function(a,b){return(b.ts||0)-(a.ts||0)||b.id-a.id}).slice(0,9),e=function(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML};
document.getElementById('hm').innerHTML='<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">'+n.map(function(x){return '<a href="#n'+x.id+'" class="block"><span class="text-xs font-bold text-[#D71920]">'+e(x.c)+'</span><h3 class="font-bold text-lg leading-snug mt-1">'+e(x.t)+'</h3></a>'}).join('')+'</div>';
document.getElementById('ticker').textContent=n.slice(0,3).map(function(x){return x.t}).join('   •   ');
}catch(x){}})();
</script>
<script type="module">
const PREVIEW=!location.hostname||/claude|anthropic|localhost/.test(location.hostname);
let IMPFAIL=false;
let initializeApp,getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail,getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,collection,query,where,DEMO=false;
try{
  const B='https://www.gstatic.com/firebasejs/10.14.1/';
  const [fa,fb,fc]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  ({initializeApp}=fa);({getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail}=fb);({getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,collection,query,where}=fc);
}catch(e){if(PREVIEW)DEMO=true;else IMPFAIL=true}

const ADMIN_EMAIL='junayedahmad5003@gmail.com';
const SHARE_BASE='';
let auth,db;
if(!DEMO&&!IMPFAIL){const app=initializeApp({
  apiKey:"AIzaSyABKCOjZnTu6155-eho8aqdGVkaxX1oVHw",
  authDomain:"saltha-sangbad.firebaseapp.com",
  projectId:"saltha-sangbad",
  appId:"1:91800137977:web:ba30064469389f181d3228"
});auth=getAuth(app);db=getFirestore(app)}

const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const $=i=>document.getElementById(i);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const CATS=['সালথা','ফরিদপুর','বাংলাদেশ','রাজনীতি','কৃষি ও অর্থনীতি'];
let S={ticker:'সালথা সংবাদে স্বাগতম',news:[]},CM=[],IS_ADMIN=false,cur=null,curCat='প্রচ্ছদ',unCm=null,loaded=false;
function fix(){S.ads=S.ads||{on:true,code:''};S.rep=S.rep||[];S.seo=S.seo||{title:'',desc:'',phone:'',addr:''};S.news=S.news||[]}
try{const c=JSON.parse(localStorage.getItem('saltha_cache')||'null');if(c&&c.news&&!DEMO)Object.assign(S,c)}catch(e){}
fix();
$('dt').textContent=new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function save(){
  if(!IS_ADMIN||!loaded)return;
  setDoc(doc(db,'site','state'),{json:JSON.stringify(S)}).catch(()=>alert('সেভ করা যায়নি'));
}
function go(v){['pub','login','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==v));window.scrollTo(0,0);if(v==='admin')tab('dash')}
function openAdmin(){IS_ADMIN?go('admin'):go('login')}
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],DN=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
function fd(ts,full){if(!ts)return '';const d=new Date(ts);let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0'),ap=h<12?'পূর্বাহ্ণ':'অপরাহ্ণ';h=h%12||12;return (full?DN[d.getDay()]+', ':'')+bn(d.getDate())+' '+MN[d.getMonth()]+', '+bn(d.getFullYear())+(full?', '+bn(h)+':'+bn(m)+' '+ap:'')}
const thumb=n=>n.im?'<img data-im="'+n.im+'" class="w-full h-full object-cover bg-gray-200">':(n.i&&/^https:\/\//.test(n.i)?'<img src="'+esc(n.i)+'" loading="lazy" class="w-full h-full object-cover">':'');
const latest=()=>S.news.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)||b.id-a.id);
function card(n,big){
  const t=thumb(n);
  return '<a href="#n'+n.id+'" class="block group">'+(t?'<div class="'+(big?'aspect-video':'aspect-[16/10]')+' overflow-hidden rounded-lg mb-2">'+t+'</div>':'')+'<h3 class="font-bold leading-snug group-hover:text-[#D71920] '+(big?'text-2xl md:text-3xl':'text-base')+'">'+esc(n.t)+'</h3>'+(big?'<p class="text-sm text-gray-600 mt-2">'+esc(n.b.slice(0,160))+'...</p>':'')+'<p class="text-xs text-gray-500 mt-1">'+esc(n.c)+' · '+esc(n.a)+(n.ts?' · '+fd(n.ts):'')+'</p></a>';
}
function row(n){const t=thumb(n);return '<a href="#n'+n.id+'" class="flex gap-3 py-2 border-b group">'+(t?'<div class="w-20 h-14 shrink-0 rounded overflow-hidden">'+t+'</div>':'')+'<span class="text-sm font-semibold leading-snug group-hover:text-[#D71920]">'+esc(n.t)+'</span></a>'}
const sec=(t,l)=>'<section class="mt-8"><h2 class="border-b-2 border-[#D71920] mb-3"><span class="bg-[#D71920] text-white px-3 py-1 inline-block font-bold">'+esc(t)+'</span></h2><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">'+l.map(n=>card(n)).join('')+'</div></section>';
function sideTab(k){
  const l=(k==='p'?S.news.slice().sort((a,b)=>b.v-a.v):latest()).slice(0,8);
  ['l','p'].forEach(x=>{const b=$('sd'+x);if(b)b.className='flex-1 py-2 font-bold text-sm '+(x===k?'bg-[#D71920] text-white':'bg-gray-200')});
  if($('sd')){$('sd').innerHTML=l.map(row).join('');fillImgs()}
}
function home(cat){
  if(cat)curCat=cat;cur=null;$('q').value='';
  if(/^#(n\d+|about|contact|privacy)$/.test(location.hash))history.replaceState(null,'',location.pathname);
  document.title=S.seo.title||'সালথা সংবাদ | সত্যের পথে, মানুষের পাশে।';
  $('reader').classList.add('hidden');$('pg').classList.add('hidden');$('hm').classList.remove('hidden');
  $('ticker').textContent=(S.ticker&&S.ticker.trim()&&S.ticker!=='সালথা সংবাদে স্বাগতম')?S.ticker:(latest().slice(0,3).map(n=>n.t).join('   •   ')||'সালথা সংবাদ');
  $('fed').textContent=S.seo.ed?'সম্পাদক ও প্রকাশক : '+S.seo.ed:'';
  $('ft').textContent='© ২০২৬ সালথা সংবাদ। সর্বস্বত্ব সংরক্ষিত।'+(S.seo.phone?' ফোন: '+S.seo.phone:'')+(S.seo.addr?' | '+S.seo.addr:'');
  const ad=$('adtop');ad.innerHTML='';
  if(S.ads.on&&S.ads.code){const f=document.createElement('iframe');f.style.cssText='width:100%;height:100px;border:0';f.setAttribute('sandbox','allow-scripts allow-popups');f.srcdoc=S.ads.code;ad.appendChild(f)}
  $('cats').innerHTML=['প্রচ্ছদ'].concat(CATS.filter(c=>c===curCat||S.news.some(n=>n.c===c))).map(c=>'<span onclick="home(\''+c+'\')" class="px-3 py-1.5 rounded whitespace-nowrap cursor-pointer '+(c===curCat?'bg-[#D71920]':'text-gray-100')+'">'+c+'</span>').join('');
  const all=latest();let h='';
  if(!all.length)h=loaded?'<p class="text-gray-500 py-10 text-center">এখনো কোনো খবর নেই।</p>':(window.dbErr?'<p class="text-gray-500 py-10 text-center">সাময়িক সমস্যা হচ্ছে। কিছুক্ষণ পর পাতাটি রিফ্রেশ করুন।</p>':'<div class="grid sm:grid-cols-3 gap-5 animate-pulse"><div class="h-44 bg-gray-200 rounded-lg"></div><div class="h-44 bg-gray-200 rounded-lg"></div><div class="h-44 bg-gray-200 rounded-lg"></div></div>');
  else if(curCat!=='প্রচ্ছদ'){const l=all.filter(n=>n.c===curCat);h=sec(curCat,l)||'';if(!l.length)h='<p class="text-gray-500 py-10 text-center">এই বিভাগে এখনো কোনো খবর নেই।</p>'}
  else{
    h='<div class="grid lg:grid-cols-12 gap-6"><div class="lg:col-span-8">'+card(all[0],true)+(all.length>1?'<div class="grid sm:grid-cols-2 gap-5 mt-5 pt-5 border-t">'+all.slice(1,5).map(n=>card(n)).join('')+'</div>':'')+'</div><aside class="lg:col-span-4"><div class="flex"><button id="sdl" onclick="sideTab(\'l\')">সর্বশেষ</button><button id="sdp" onclick="sideTab(\'p\')">সর্বাধিক পঠিত</button></div><div id="sd" class="bg-white border p-3"></div></aside></div>'
      +CATS.map(c=>{const l=all.filter(n=>n.c===c).slice(0,4);return l.length?sec(c,l):''}).join('');
  }
  $('hm').innerHTML=h;sideTab('l');fillImgs();
}
function search(v){
  v=v.trim();if(!v){home();return}
  $('reader').classList.add('hidden');$('pg').classList.add('hidden');$('hm').classList.remove('hidden');
  const l=latest().filter(n=>(n.t+n.b).includes(v));
  $('hm').innerHTML='<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">'+(l.map(n=>card(n)).join('')||'<p class="text-gray-500">কিছু পাওয়া যায়নি।</p>')+'</div>';fillImgs();
}
const shareUrl=n=>SHARE_BASE?SHARE_BASE+'/n/'+n.id:location.origin+location.pathname+'#n'+n.id;
function shareBar(n){
  const u=encodeURIComponent(shareUrl(n)),t=encodeURIComponent(n.t);
  const b=(bg,l,href,tt)=>'<a href="'+href+'" target="_blank" rel="noopener" title="'+tt+'" class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm" style="background:'+bg+'">'+l+'</a>';
  return b('#1877F2','f','https://www.facebook.com/sharer/sharer.php?u='+u,'Facebook')+b('#000','𝕏','https://twitter.com/intent/tweet?url='+u+'&text='+t,'X')+b('#25D366','W','https://wa.me/?text='+t+'%20'+u,'WhatsApp')+b('#0A66C2','in','https://www.linkedin.com/sharing/share-offsite/?url='+u,'LinkedIn')+b('#229ED9','✈','https://t.me/share/url?url='+u+'&text='+t,'Telegram')+b('#E60023','P','https://pinterest.com/pin/create/button/?url='+u+'&description='+t,'Pinterest')
   +'<button onclick="window.print()" title="প্রিন্ট" class="w-10 h-10 rounded-full bg-gray-400 text-white">🖨</button><button onclick="copyLink()" title="লিংক কপি" class="w-10 h-10 rounded-full bg-gray-700 text-white">🔗</button>';
}
function copyLink(){const u=shareUrl(cur);(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('লিংক কপি হয়েছে')).catch(()=>prompt('লিংক কপি করুন',u))}
let taps=0,tt;
function tapLogo(){taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,2000);if(taps>=5){taps=0;openAdmin()}}
function showNews(id){
  const n=S.news.find(x=>x.id===id);
  $('hm').classList.add('hidden');$('pg').classList.add('hidden');$('reader').classList.remove('hidden');
  if(!n){$('r-title').textContent=loaded?'খবরটি পাওয়া যায়নি':'লোড হচ্ছে...';return}
  const fresh=!cur||cur.id!==id;
  if(fresh){n.v++;if(IS_ADMIN)save()}
  cur=n;document.title=n.t+' | সালথা সংবাদ';
  $('r-cat').textContent=n.c;$('r-title').textContent=n.t;
  $('r-by').textContent='✎ '+n.a;$('r-time').textContent='🕘 '+(fd(n.ts,true)||'')+' · 👁 '+bn(n.v);
  $('r-share').innerHTML=shareBar(n);$('r-vid').innerHTML=vidEmbed(n.vd);
  const im=$('r-img');delete im.dataset.im;im.removeAttribute('src');
  if(n.im){im.dataset.im=n.im;im.classList.remove('hidden')}else if(n.i&&/^https:\/\//.test(n.i)){im.src=n.i;im.classList.remove('hidden')}else im.classList.add('hidden');
  $('r-body').innerHTML=esc(n.b).replace(/\n/g,'<br><br>');
  $('r-foot').innerHTML='<b>বিভাগ:</b> '+esc(n.c)+' &nbsp;|&nbsp; <b>প্রতিবেদক:</b> '+esc(n.a)+(n.ts?' &nbsp;|&nbsp; <b>প্রকাশ:</b> '+fd(n.ts,true):'');
  const rel=latest().filter(x=>x.c===n.c&&x.id!==n.id).slice(0,4);
  $('r-rel').innerHTML=rel.length?'<h3 class="font-bold text-lg mb-3 border-b-2 border-[#D71920] inline-block">আরও পড়ুন</h3><div class="grid sm:grid-cols-2 gap-4">'+rel.map(x=>card(x)).join('')+'</div>':'';
  renderCm();fillImgs();if(fresh)window.scrollTo(0,0);
}

function showPage(k){
  const p=PAGES[k];
  $('hm').classList.add('hidden');$('reader').classList.add('hidden');$('pg').classList.remove('hidden');
  cur=null;document.title=p[0]+' | সালথা সংবাদ';
  $('pg').innerHTML='<p class="text-xs text-gray-500"><a href="#" onclick="home();return false" class="text-[#D71920] font-bold">প্রচ্ছদ</a> › '+p[0]+'</p><h1 class="text-2xl font-extrabold mt-2 mb-4">'+p[0]+'</h1><div class="space-y-3 text-[16px] leading-8">'+p[1]()+'</div>';
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash;
  if(h==='#saltha-admin'){history.replaceState(null,'',location.pathname);openAdmin();return}
  const m=h.match(/^#n(\d+)$/);
  if(m)showNews(+m[1]);else if(PAGES[h.slice(1)])showPage(h.slice(1));else home();
}
addEventListener('hashchange',()=>{if(!$('pub').classList.contains('hidden')||location.hash==='#saltha-admin')route()});

function renderCm(){
  if(!cur)return;
  const l=CM.filter(c=>c.nid===cur.id&&c.ok).sort((a,b)=>a.id-b.id),k=$('cmsg'),msg=k?k.outerHTML:'<p id="cmsg" class="text-sm"></p>';
  $('cm').innerHTML='<h3 class="font-bold text-lg mb-3 border-b-2 border-[#D71920] inline-block">পাঠকের মন্তব্য ('+bn(l.length)+')</h3>'+l.map(c=>'<div class="flex gap-3 py-3 border-b"><div class="w-9 h-9 shrink-0 rounded-full bg-[#123B63] text-white flex items-center justify-center font-bold">'+esc(c.name.charAt(0))+'</div><div><b class="text-sm">'+esc(c.name)+'</b><p class="text-sm mt-0.5">'+esc(c.txt)+'</p></div></div>').join('')
   +'<form onsubmit="addCm(event)" class="mt-4 space-y-2"><p class="font-semibold text-sm">আপনার মন্তব্য লিখুন</p><input id="c-n" maxlength="50" placeholder="আপনার নাম (ঐচ্ছিক)" class="w-full border rounded px-3 py-2 text-sm"><textarea id="c-t" required maxlength="500" rows="3" placeholder="মন্তব্য লিখুন" class="w-full border rounded px-3 py-2 text-sm"></textarea><button class="bg-[#D71920] text-white px-5 py-2 rounded text-sm font-bold">মন্তব্য পাঠান</button>'+msg+'</form>';
}
function addCm(e){
  e.preventDefault();
  const b=e.target.querySelector('button'),m=$('cmsg'),t=$('c-t').value.trim();if(!t)return;
  b.disabled=true;m.className='text-sm text-gray-500';m.textContent='পাঠানো হচ্ছে...';
  setDoc(doc(db,'comments',String(Date.now())),{nid:cur.id,name:$('c-n').value.trim()||'পাঠক',txt:t,ok:false})
   .then(()=>{$('c-t').value='';b.disabled=false;m.className='text-sm text-green-700 font-semibold';m.textContent='✔ আপনার মন্তব্য পাঠানো হয়েছে। সম্পাদকের অনুমোদনের পর এখানে দেখা যাবে।'})
   .catch(()=>{b.disabled=false;m.className='text-sm text-red-600';m.textContent='মন্তব্য পাঠানো যায়নি। নেট দেখে আবার চেষ্টা করুন।'});
}
const okCm=id=>updateDoc(doc(db,'comments',String(id)),{ok:true});
const delCm=id=>deleteDoc(doc(db,'comments',String(id)));

function watchCm(){
  if(unCm)unCm();
  const q=IS_ADMIN?collection(db,'comments'):query(collection(db,'comments'),where('ok','==',true));
  unCm=onSnapshot(q,s=>{
    window.cmErr=0;CM=s.docs.map(d=>{const x=d.data();x.id=Number(d.id);return x});
    if(cur&&!$('reader').classList.contains('hidden'))renderCm();
    if(IS_ADMIN&&!$('admin').classList.contains('hidden')&&$('tab').dataset.t==='cm')tab('cm');
  },()=>{window.cmErr=1;if(IS_ADMIN&&$('tab').dataset.t==='cm')tab('cm')});
}

async function doLogin(e){
  e.preventDefault();const er=$('err');
  try{
    const c=await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);
    if((c.user.email||'').toLowerCase()!==ADMIN_EMAIL){await signOut(auth);throw 0}
    er.classList.add('hidden');$('pw').value='';go('admin');
  }catch(x){er.textContent='ইমেইল বা পাসওয়ার্ড ভুল হয়েছে।';er.classList.remove('hidden')}
}
function resetPw(mail){
  mail=(mail||ADMIN_EMAIL).trim();
  sendPasswordResetEmail(auth,mail).then(()=>alert('পাসওয়ার্ড বদলানোর লিংক ইমেইলে পাঠানো হয়েছে (স্প্যাম ফোল্ডারও দেখুন)')).catch(()=>alert('ইমেইল পাঠানো যায়নি'));
}
function logout(){signOut(auth).then(()=>go('pub'))}

function vidEmbed(u){
  if(!u||!/^https:\/\//.test(u))return '';
  const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if(m)return '<div class="aspect-video"><iframe class="w-full h-full rounded-lg" src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen loading="lazy"></iframe></div>';
  if(/facebook\.com|fb\.watch/.test(u))return '<div class="aspect-video"><iframe class="w-full h-full rounded-lg" src="https://www.facebook.com/plugins/video.php?href='+encodeURIComponent(u)+'&show_text=false" allowfullscreen loading="lazy"></iframe></div>';
  return '';
}
const IMG={};
function fillImgs(){document.querySelectorAll('img[data-im]').forEach(el=>{const id=el.dataset.im;if(IMG[id]){el.src=IMG[id];return}getDoc(doc(db,'images',id)).then(x=>{if(x.exists()){IMG[id]=x.data().d;el.src=IMG[id]}}).catch(()=>{})})}
function compress(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>700000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};im.onerror=rej;im.src=u})}
